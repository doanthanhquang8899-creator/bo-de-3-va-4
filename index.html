</style><body><header><a href="#" id="logo">✦ <b>GDQP<span>&</span>AN</b><small>KHÔNG GIAN ÔN LUYỆN</small></a><button id="home">Tổng quan ↗</button></header><main id="app"></main><footer>Học chắc kiến thức · Vững vàng bước vào hội thi<br>Chấm theo đáp án trong tài liệu gốc. Chưa thẩm định tính chính xác và hiệu lực các nội dung.</footer><script>const QUESTIONS=[{"id": 1, "set": 3, "number": 1, "level": "Nhận biết", "text": "Thông tư số 46/2020/TT-BGDĐT ban hành Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông được ban hành vào ngày, tháng, năm nào?", "options": ["Ngày 24/11/2020", "Ngày 20/7/2021", "Ngày 26/12/2018", "Ngày 22/12/2022"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, phần đầu văn bản (Hà Nội, ngày 24 tháng 11 năm 2020).", "explanation": ""}, {"id": 2, "set": 3, "number": 2, "level": "Nhận biết", "text": "Theo Điều 10 Luật Giáo dục quốc phòng và an ninh, giáo dục quốc phòng và an ninh trong trường tiểu học, trung học cơ sở được thực hiện như thế nào?", "options": ["Lồng ghép thông qua nội dung các môn học, kết hợp với hoạt động ngoại khoá", "Là môn học tự chọn, tổ chức theo nguyện vọng của học sinh và cha mẹ", "Là môn học chính khoá, có thời lượng riêng trong chương trình giáo dục", "Chỉ tổ chức bằng hoạt động ngoại khoá tập trung trong kì nghỉ hè hằng năm"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 10 khoản 1.", "explanation": ""}, {"id": 3, "set": 3, "number": 3, "level": "Nhận biết", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, bao nhiêu phần trăm giáo viên của môn học phải có trình độ được đào tạo đạt chuẩn hoặc trên chuẩn?", "options": ["Trên 80% giáo viên", "100% giáo viên", "Trên 70% giáo viên", "Trên 90% giáo viên"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.3.", "explanation": ""}, {"id": 4, "set": 3, "number": 4, "level": "Nhận biết", "text": "Luật Nhà giáo số 73/2025/QH15 có hiệu lực thi hành từ ngày nào?", "options": ["Ngày 01/7/2025", "Ngày 01/7/2026", "Ngày 01/9/2025", "Ngày 01/01/2026"], "answer": 3, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 41 khoản 1.", "explanation": ""}, {"id": 5, "set": 3, "number": 5, "level": "Nhận biết", "text": "Tháng 4/1945, Hội nghị Quân sự Bắc Kì của Đảng quyết định hợp nhất các tổ chức vũ trang trong nước thành tổ chức nào?", "options": ["Quân đội Quốc gia Việt Nam", "Việt Nam Cứu quốc quân", "Việt Nam Giải phóng quân", "Vệ quốc đoàn"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Lịch sử Quân đội nhân dân Việt Nam”.", "explanation": ""}, {"id": 6, "set": 3, "number": 6, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 11, khu vực biên giới trên không gồm phần không gian dọc biên giới quốc gia có chiều rộng bao nhiêu tính từ biên giới quốc gia trở vào?", "options": ["10 km", "5 km", "20 km", "15 km"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Khu vực biên giới”.", "explanation": ""}, {"id": 7, "set": 3, "number": 7, "level": "Nhận biết", "text": "Theo Luật Nghĩa vụ quân sự, trong thời bình, thời hạn phục vụ tại ngũ của hạ sĩ quan, binh sĩ là bao nhiêu tháng?", "options": ["36 tháng", "18 tháng", "30 tháng", "24 tháng"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Thời hạn phục vụ tại ngũ”.", "explanation": ""}, {"id": 8, "set": 3, "number": 8, "level": "Nhận biết", "text": "Mặt trận Đoàn kết dân tộc cứu nước Campuchia ra đời vào ngày nào?", "options": ["Ngày 23/12/1978", "Ngày 15/6/1978", "Ngày 2/12/1978", "Ngày 7/1/1979"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục về chiến tranh bảo vệ biên giới Tây Nam.", "explanation": ""}, {"id": 9, "set": 3, "number": 9, "level": "Thông hiểu", "text": "Theo Điều 6 Luật Giáo dục quốc phòng và an ninh, Nhà nước có chính sách ưu tiên về giáo dục quốc phòng và an ninh đối với khu vực nào?", "options": ["Các thành phố trực thuộc trung ương và khu công nghiệp", "Các cơ sở giáo dục đại học trọng điểm và trường chuyên", "Khu vực biên giới, hải đảo, miền núi, vùng sâu, vùng xa", "Các địa phương tự cân đối được ngân sách nhà nước"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 6 khoản 1.", "explanation": ""}, {"id": 10, "set": 3, "number": 10, "level": "Thông hiểu", "text": "Hành vi nào sau đây bị nghiêm cấm theo Điều 9 Luật Giáo dục quốc phòng và an ninh?", "options": ["Mời chuyên gia, nhà khoa học tham gia bồi dưỡng kiến thức quốc phòng", "Lợi dụng giáo dục quốc phòng và an ninh để tiết lộ bí mật nhà nước", "Lồng ghép giáo dục quốc phòng và an ninh vào các môn học ở tiểu học", "Đóng góp tiền, tài sản của cá nhân cho giáo dục quốc phòng và an ninh"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 9 khoản 1.", "explanation": ""}, {"id": 11, "set": 3, "number": 11, "level": "Thông hiểu", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, năng lực đặc thù của môn học gồm những thành phần nào?", "options": ["Điều chỉnh hành vi; phát triển bản thân; tìm hiểu và tham gia các hoạt động kinh tế – xã hội", "Tự chủ và tự học; giao tiếp và hợp tác; giải quyết vấn đề và sáng tạo trong học tập, rèn luyện", "Chăm sóc sức khoẻ; vận động cơ bản; hoạt động thể dục thể thao phù hợp với lứa tuổi học sinh", "Nhận thức các vấn đề về quốc phòng, an ninh; vận dụng kiến thức, kĩ năng quân sự vào cuộc sống"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục IV.2.", "explanation": ""}, {"id": 12, "set": 3, "number": 12, "level": "Thông hiểu", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, đánh giá định kì được tổ chức như thế nào?", "options": ["Ở cuối học kì và cuối năm học, bằng trắc nghiệm khách quan và tự luận hoặc thực hành", "Một lần duy nhất vào cuối cấp học, bằng hình thức hội thao giáo dục quốc phòng và an ninh", "Hằng tháng, bằng bài viết thu hoạch do học sinh tự lựa chọn đề tài và tự chấm điểm", "Sau mỗi bài học, bằng quan sát trên lớp, đối thoại và để học sinh tự đánh giá lẫn nhau"], "answer": 0, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.1.", "explanation": ""}, {"id": 13, "set": 3, "number": 13, "level": "Thông hiểu", "text": "Nội dung nào sau đây là yêu cầu đánh giá học sinh theo Điều 4 Thông tư 22/2021/TT-BGDĐT?", "options": ["Đánh giá chỉ căn cứ vào điểm số của các bài kiểm tra định kì", "Đánh giá vì sự tiến bộ của học sinh; không so sánh học sinh với nhau", "Đánh giá chủ yếu để xếp thứ hạng học sinh trong từng lớp và trong toàn khối", "Đánh giá dựa trên việc so sánh kết quả giữa các học sinh cùng lớp"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 4 khoản 4.", "explanation": ""}, {"id": 14, "set": 3, "number": 14, "level": "Thông hiểu", "text": "Theo Luật Giáo dục (sửa đổi năm 2025), ai có thẩm quyền quyết định một bộ sách giáo khoa giáo dục phổ thông sử dụng thống nhất toàn quốc?", "options": ["Uỷ ban nhân dân cấp tỉnh", "Hội đồng quốc gia thẩm định sách giáo khoa", "Bộ trưởng Bộ Giáo dục và Đào tạo", "Thủ tướng Chính phủ"], "answer": 2, "source": "Luật số 123/2025/QH15 sửa đổi, bổ sung Luật Giáo dục, Điều 1 khoản 8 (sửa đổi Điều 32 Luật Giáo dục).", "explanation": ""}, {"id": 15, "set": 3, "number": 15, "level": "Thông hiểu", "text": "Theo Luật Nhà giáo năm 2025, lương của nhà giáo ở cơ sở giáo dục công lập được xếp như thế nào?", "options": ["Được xếp ngang với công chức hành chính có cùng trình độ và thâm niên", "Được xếp cao nhất trong hệ thống thang bậc lương hành chính sự nghiệp", "Do người đứng đầu cơ sở giáo dục công lập quyết định theo năm học", "Được tính theo số tiết dạy thực tế của nhà giáo trong từng năm học"], "answer": 1, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 23 khoản 1 điểm a.", "explanation": ""}, {"id": 16, "set": 3, "number": 16, "level": "Thông hiểu", "text": "Trong kháng chiến chống thực dân Pháp, Quân đội ta lần lượt mang những tên gọi nào?", "options": ["Quân đội Quốc gia Việt Nam → Vệ quốc đoàn → Quân đội nhân dân Việt Nam", "Việt Nam Giải phóng quân → Quân đội nhân dân Việt Nam → Vệ quốc đoàn", "Vệ quốc đoàn → Việt Nam Giải phóng quân → Quân đội Quốc gia Việt Nam", "Vệ quốc đoàn → Quân đội Quốc gia Việt Nam → Quân đội nhân dân Việt Nam"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Lịch sử Quân đội nhân dân Việt Nam” (Vệ quốc đoàn 11/1945 – 5/1946; Quân đội Quốc gia Việt Nam 5/1946 – 1950; Quân đội nhân dân Việt Nam từ năm 1950).", "explanation": ""}, {"id": 17, "set": 3, "number": 17, "level": "Thông hiểu", "text": "Theo Luật Công an nhân dân (trích trong sách giáo khoa lớp 10), vị trí của Công an nhân dân được xác định như thế nào?", "options": ["Là lực lượng vũ trang quần chúng không thoát li sản xuất, công tác ở địa phương, cơ sở", "Là lực lượng nòng cốt trong bảo vệ an ninh Tổ quốc, đấu tranh phòng, chống tội phạm", "Là lực lượng nòng cốt của quân đội, thành phần chủ yếu trong đội ngũ cán bộ quân đội", "Là lực lượng chuyên trách quản lí, bảo vệ biên giới quốc gia và khu vực biên giới"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục về Luật Công an nhân dân (trích Điều 15).", "explanation": ""}, {"id": 18, "set": 3, "number": 18, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, hệ thống báo hiệu đường bộ gồm những thành phần nào?", "options": ["Biển báo hiệu đường bộ, dải phân cách cố định và gờ giảm tốc trên mặt đường", "Hiệu lệnh của người điều khiển giao thông, tín hiệu đèn giao thông, biển báo hiệu đường bộ", "Tín hiệu đèn giao thông, biển báo hiệu đường bộ và hệ thống camera giám sát, xử phạt nguội", "Hiệu lệnh của người điều khiển giao thông và tín hiệu còi của các phương tiện ưu tiên"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Thực hiện nghiêm các quy định về trật tự an toàn giao thông”.", "explanation": ""}, {"id": 19, "set": 3, "number": 19, "level": "Thông hiểu", "text": "Theo nội dung Luật An ninh mạng nêu trong sách giáo khoa lớp 10, khi tham gia trên không gian mạng, trẻ em có những quyền nào?", "options": ["Được bảo vệ, tiếp cận thông tin, vui chơi, giải trí, giữ bí mật cá nhân và đời sống riêng tư", "Được miễn mọi trách nhiệm pháp lí đối với các nội dung do mình đăng tải hoặc chia sẻ trên mạng", "Được sử dụng mọi dịch vụ trên không gian mạng mà không chịu bất kì sự giám sát, quản lí nào", "Được tự do chia sẻ thông tin cá nhân của người khác khi thấy cần thiết"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Bảo vệ trẻ em trên không gian mạng”.", "explanation": ""}, {"id": 20, "set": 3, "number": 20, "level": "Thông hiểu", "text": "Theo Luật Biên giới quốc gia, biên giới quốc gia trên biển của Việt Nam được xác định là gì?", "options": ["Ranh giới phía ngoài của thềm lục địa, cách đường cơ sở của Việt Nam không quá 350 hải lí", "Ranh giới phía ngoài của vùng đặc quyền kinh tế tính từ đường cơ sở ra phía biển của Việt Nam", "Đường cơ sở dùng để tính chiều rộng lãnh hải của đất liền và của các đảo ven bờ của Việt Nam", "Ranh giới phía ngoài lãnh hải của đất liền, lãnh hải của đảo, lãnh hải của quần đảo của Việt Nam"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Biên giới quốc gia”.", "explanation": ""}, {"id": 21, "set": 3, "number": 21, "level": "Thông hiểu", "text": "Nhóm hành vi nào sau đây là biểu hiện của tệ nạn mê tín dị đoan?", "options": ["Bói toán, đồng bóng, yểm bùa, cúng giải hạn, cúng trừ tà ma", "Mua bán số lô, số đề, cá độ bóng đá bằng tiền hoặc hiện vật", "Hút, hít, tiêm chích thuốc phiện, heroin và các loại ma tuý khác", "Thờ cúng tổ tiên, đi lễ đầu năm, tham gia lễ hội truyền thống"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), mục “Một số loại tệ nạn xã hội”.", "explanation": ""}, {"id": 22, "set": 3, "number": 22, "level": "Thông hiểu", "text": "Theo pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ, vật liệu nổ gồm những loại nào?", "options": ["Thuốc nổ, súng săn và pháo hoa", "Phụ kiện nổ và công cụ hỗ trợ", "Thuốc nổ và vũ khí quân dụng", "Thuốc nổ và phụ kiện nổ"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục “Một số khái niệm”.", "explanation": ""}, {"id": 23, "set": 3, "number": 23, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, khi bạo loạn xảy ra, yêu cầu xử lí được xác định như thế nào?", "options": ["Xử lí như nhau đối với mọi người có mặt tại hiện trường, không cần phân loại đối tượng", "Chỉ sử dụng biện pháp tuyên truyền, vận động; không áp dụng bất kì biện pháp nào khác", "Chờ bạo loạn tự lắng xuống rồi mới xem xét trách nhiệm của những người đã tham gia gây rối", "Xử lí kiên quyết, linh hoạt, nhanh chóng, đúng đối tượng; không để lan rộng, kéo dài"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục “Một số giải pháp phòng, chống chiến lược “diễn biến hoà bình”, bạo loạn lật đổ”.", "explanation": ""}, {"id": 24, "set": 3, "number": 24, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, thành phần của lực lượng vũ trang địa phương gồm những lực lượng nào?", "options": ["Bộ đội địa phương, Dân quân tự vệ, lực lượng dự bị động viên, bộ đội biên phòng ở địa phương biên giới và công an cấp tỉnh, cấp xã", "Bộ đội chủ lực, bộ đội địa phương, các binh đoàn cơ động chiến lược của Bộ Quốc phòng và lực lượng cảnh sát cơ động của Bộ Công an", "Hải quân, Phòng không – Không quân, Cảnh sát biển, bộ đội biên phòng ở các địa phương biên giới và lực lượng kiểm ngư", "Dân quân tự vệ, thanh niên xung phong, dân công hoả tuyến, lực lượng bảo vệ an ninh, trật tự ở cơ sở và công an cấp xã"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Thành phần của lực lượng vũ trang địa phương”.", "explanation": ""}, {"id": 25, "set": 3, "number": 25, "level": "Vận dụng", "text": "Cuối năm học, học sinh L có kết quả rèn luyện cả năm mức Tốt, kết quả học tập cả năm mức Tốt và có 05 môn học đánh giá bằng điểm số có điểm trung bình môn cả năm từ 9,0 trở lên. Theo Thông tư 22/2021/TT-BGDĐT, L được khen thưởng danh hiệu nào?", "options": ["“Học sinh Tiên tiến”, vì số môn đạt từ 9,0 điểm trở lên chưa quá một nửa số môn học", "Không được khen thưởng, vì danh hiệu chỉ xét cho học sinh có tất cả các môn từ 9,0", "“Học sinh Giỏi”, vì chưa đủ ít nhất 06 môn có điểm trung bình môn cả năm từ 9,0 trở lên", "“Học sinh Xuất sắc”, vì kết quả rèn luyện và kết quả học tập cả năm đều đạt mức Tốt"], "answer": 2, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 15 khoản 1 điểm a.", "explanation": ""}, {"id": 26, "set": 3, "number": 26, "level": "Vận dụng", "text": "Học sinh N có kết quả rèn luyện cả năm học được đánh giá mức Chưa đạt. Theo Thông tư 22/2021/TT-BGDĐT, việc rèn luyện trong kì nghỉ hè của N được tổ chức như thế nào?", "options": ["Giáo viên chủ nhiệm giao nhiệm vụ theo hình thức do Hiệu trưởng quy định và thông báo đến cha mẹ học sinh", "Giáo viên môn học giao bài tập ôn luyện; kết quả do tổ chuyên môn đánh giá và báo cáo Hiệu trưởng", "Hiệu trưởng trực tiếp giao nhiệm vụ rèn luyện trong kì nghỉ hè cho N và không cần thông báo đến cha mẹ học sinh", "N phải ở lại lớp ngay, vì kết quả rèn luyện mức Chưa đạt không được xét rèn luyện trong kì nghỉ hè"], "answer": 0, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 13.", "explanation": ""}, {"id": 27, "set": 3, "number": 27, "level": "Vận dụng", "text": "Anh T đã có bằng tốt nghiệp đại học ngành Sư phạm Lịch sử, chưa từng là giáo viên và chưa có chứng chỉ đào tạo giáo dục quốc phòng và an ninh. Anh muốn được đào tạo để trở thành giáo viên giáo dục quốc phòng và an ninh. Theo Điều 24 Luật Giáo dục quốc phòng và an ninh, hình thức đào tạo nào áp dụng với anh T?", "options": ["Đào tạo văn bằng 2, tập trung 18 tháng", "Đào tạo văn bằng 2, tập trung 02 năm", "Bồi dưỡng ngắn hạn, tập trung 06 tháng", "Đào tạo chính quy, tập trung 04 năm"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 24 khoản 1 điểm b.", "explanation": ""}, {"id": 28, "set": 3, "number": 28, "level": "Vận dụng", "text": "Khi soạn bài “Kĩ thuật sử dụng lựu đạn”, giáo viên viết hai yêu cầu cần đạt: (1) Nêu được cấu tạo, tính năng của lựu đạn; (2) Thực hành được động tác ném lựu đạn xa, đúng hướng. Đối chiếu bảng động từ mô tả mức độ trong Chương trình môn Giáo dục quốc phòng và an ninh, hai yêu cầu này lần lượt thuộc mức độ nào?", "options": ["(1) mức Hiểu; (2) mức Biết", "(1) mức Biết; (2) mức Hiểu", "(1) mức Vận dụng; (2) mức Hiểu", "(1) mức Biết; (2) mức Vận dụng"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.1.2 (Biết: nêu được, mô tả được…; Vận dụng: thực hành được, điều chỉnh được…).", "explanation": ""}, {"id": 29, "set": 3, "number": 29, "level": "Vận dụng", "text": "Một trường trung học phổ thông công lập thiếu giáo viên Giáo dục quốc phòng và an ninh và đề nghị được tuyển dụng bổ sung. Theo Nghị quyết số 248/2025/QH15, ai có thẩm quyền tuyển dụng, tiếp nhận nhà giáo cho cơ sở giáo dục phổ thông công lập trên địa bàn tỉnh?", "options": ["Hiệu trưởng trường trung học phổ thông", "Chủ tịch Uỷ ban nhân dân cấp xã", "Giám đốc Sở Giáo dục và Đào tạo", "Giám đốc Sở Nội vụ"], "answer": 2, "source": "Nghị quyết số 248/2025/QH15, Điều 2 khoản 1 điểm a.", "explanation": ""}, {"id": 30, "set": 3, "number": 30, "level": "Vận dụng", "text": "Trên đường đi học, một nhóm học sinh tới nơi đường bộ giao nhau với đường sắt có đèn tín hiệu, rào chắn và chuông báo hiệu. Đèn đỏ đã bật sáng, chuông đang kêu, rào chắn đang dịch chuyển. Nhóm học sinh cần xử lí như thế nào?", "options": ["Chờ đến khi tàu đi qua là có thể đi ngay, không cần chờ đèn tắt, chuông ngừng và rào chắn mở hết", "Tăng tốc vượt qua trước khi rào chắn đóng hẳn, vì tàu thường còn cách nơi giao nhau một khoảng xa", "Dừng lại cách rào chắn một khoảng an toàn; chỉ đi khi đèn tắt, rào chắn mở hết, chuông ngừng", "Dừng sát đường ray để quan sát; nếu chưa nhìn thấy tàu thì dắt xe luồn qua rào chắn để đi tiếp"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường sắt”.", "explanation": ""}, {"id": 31, "set": 3, "number": 31, "level": "Vận dụng", "text": "An điều khiển xe đạp chở một bạn ngồi sau, một tay cầm ô che nắng và đi song song với xe của bạn khác để trò chuyện. Theo quy định nêu trong sách giáo khoa lớp 10, An đã mắc những lỗi nào?", "options": ["Một lỗi: chở người ngồi sau khi đang điều khiển xe đạp", "Hai lỗi: sử dụng ô khi điều khiển xe và đi xe dàn hàng ngang", "Không mắc lỗi, vì xe đạp là phương tiện giao thông thô sơ", "Ba lỗi: chở người, sử dụng ô và không đội mũ bảo hiểm"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường bộ” (xe đạp được chở một người; người đi xe đạp không bắt buộc đội mũ bảo hiểm).", "explanation": ""}, {"id": 32, "set": 3, "number": 32, "level": "Vận dụng", "text": "Tại một quán nước có Wifi miễn phí, Lan định đăng nhập tài khoản ngân hàng của mẹ để chuyển tiền giúp mẹ. Nhận định nào đúng với biện pháp bảo mật thông tin cá nhân nêu trong sách giáo khoa lớp 10?", "options": ["Có thể làm, vì thông tin tài khoản ngân hàng không thuộc nhóm thông tin cá nhân cần bảo mật", "Nên làm ngay, vì mạng Wifi miễn phí ở nơi công cộng luôn được nhà cung cấp dịch vụ mã hoá an toàn", "Có thể làm, miễn là Lan thoát khỏi tài khoản và xoá lịch sử truy cập sau khi chuyển tiền xong", "Không nên, vì tin tặc có thể bí mật thiết lập chương trình trung gian để theo dõi người dùng"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Một số biện pháp bảo mật thông tin cá nhân”.", "explanation": ""}, {"id": 33, "set": 3, "number": 33, "level": "Vận dụng", "text": "Hoà là công dân nam đủ 17 tuổi trong năm, thuộc diện phải đăng kí nghĩa vụ quân sự nhưng lần đầu tiên không thực hiện đăng kí. Theo Nghị định số 218/2025/NĐ-CP nêu trong sách giáo khoa lớp 11, Hoà bị xử lí như thế nào?", "options": ["Phạt tiền từ 8 000 000 đồng đến 10 000 000 đồng", "Phạt tiền từ 15 000 000 đồng đến 20 000 000 đồng", "Phạt tiền từ 3 000 000 đồng đến 5 000 000 đồng", "Phạt cảnh cáo"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Xử lí vi phạm hành chính”.", "explanation": ""}, {"id": 34, "set": 3, "number": 34, "level": "Vận dụng", "text": "Gia đình bạn Q đang giữ một thanh kiếm cổ do ông cố để lại và coi đó là đồ gia bảo. Theo quy định của pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ nêu trong sách giáo khoa lớp 11, nhận định nào đúng?", "options": ["Phải giao nộp cho công an trong mọi trường hợp, không ngoại lệ", "Chỉ được giữ khi là đồ gia bảo đã được cơ quan cấp xã cấp phép", "Được tự do cất giữ trong nhà, vì kiếm chỉ là vũ khí thô sơ", "Được mang theo đến nơi công cộng nếu đã để trong bao kín"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục “Các hành vi bị nghiêm cấm” (cá nhân sở hữu trái phép, trừ hiện vật trưng bày, đồ gia bảo được cơ quan cấp xã cấp phép).", "explanation": ""}, {"id": 35, "set": 3, "number": 35, "level": "Vận dụng", "text": "Trên một diễn đàn, có ý kiến cho rằng: “Ở quần đảo Trường Sa chỉ có Việt Nam và Trung Quốc tuyên bố chủ quyền”. Dựa vào kiến thức sách giáo khoa lớp 12, em nhận xét ý kiến này như thế nào?", "options": ["Chính xác, vì tranh chấp về chủ quyền tại quần đảo này chỉ mới phát sinh từ năm 1988", "Chưa chính xác, vì có 5 nước 6 bên tuyên bố chủ quyền toàn bộ hoặc một phần quần đảo này", "Chính xác, vì các nước khác trong khu vực chỉ có hoạt động đánh bắt hải sản tại quần đảo này", "Chưa chính xác, vì có tất cả 10 nước thành viên ASEAN cùng tuyên bố chủ quyền tại đây"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục về đấu tranh bảo vệ chủ quyền biển, đảo (Việt Nam, Trung Quốc, Philippines, Malaysia, Brunei và Đài Loan (Trung Quốc)).", "explanation": ""}, {"id": 36, "set": 3, "number": 36, "level": "Vận dụng", "text": "Lớp 12A được giao chăm sóc nghĩa trang liệt sĩ của phường nhân ngày 27/7. Một số bạn cho rằng đây là việc của chính quyền, không phải việc của học sinh. Theo trách nhiệm của học sinh nêu trong sách giáo khoa lớp 12, cách ứng xử nào phù hợp?", "options": ["Tích cực tham gia, vì học sinh cần biết ơn, trân trọng cống hiến, hi sinh của thế hệ đi trước và giữ gìn truyền thống quê hương", "Chỉ tham gia nếu được cộng điểm rèn luyện, vì hoạt động này không thuộc nội dung của môn học Giáo dục quốc phòng và an ninh", "Cử một vài bạn tham gia cho đủ thành phần, vì việc tìm hiểu truyền thống quê hương chỉ cần thực hiện ở trên lớp", "Đề nghị nhà trường huỷ hoạt động, vì giữ gìn và phát huy truyền thống là nhiệm vụ riêng của lực lượng vũ trang địa phương"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Trách nhiệm của học sinh”.", "explanation": ""}, {"id": 37, "set": 3, "number": 37, "level": "Vận dụng cao", "text": "Cuối năm học, học sinh X có kết quả rèn luyện cả năm mức Đạt, nghỉ học 20 buổi. Trong 9 môn học đánh giá bằng điểm số, X có 4 môn có điểm trung bình môn cả năm dưới 5,0 (Toán 4,2; Vật lí 4,5; Giáo dục quốc phòng và an ninh 4,6; Hoá học 4,8), các môn còn lại từ 5,0 trở lên; các môn đánh giá bằng nhận xét đều Đạt. Theo Thông tư 22/2021/TT-BGDĐT, kết luận nào đúng?", "options": ["Học tập mức Chưa đạt; X phải rèn luyện trong kì nghỉ hè theo nhiệm vụ do giáo viên chủ nhiệm giao rồi mới xét", "Học tập mức Đạt; X được lên lớp ngay vì kết quả rèn luyện mức Đạt và số buổi nghỉ học chưa vượt quá 45 buổi", "Học tập mức Chưa đạt; X được đánh giá lại bốn môn dưới 5,0 trong kì nghỉ hè, kết quả đánh giá lại dùng để xét lên lớp", "Học tập mức Chưa đạt; X không được lên lớp và không được đánh giá lại vì có quá ba môn học dưới 5,0 điểm"], "answer": 2, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 9 khoản 2, Điều 12, Điều 14 (mức Đạt cần ít nhất 06 môn từ 5,0 trở lên; X chỉ có 05 môn).", "explanation": ""}, {"id": 38, "set": 3, "number": 38, "level": "Vận dụng cao", "text": "Tổ Giáo dục quốc phòng và an ninh đề xuất: (1) đánh giá thường xuyên bằng hỏi – đáp, thực hành và sản phẩm học tập; (2) kiểm tra, đánh giá cuối học kì bằng bài thực hành; (3) công bố bảng xếp hạng học sinh từ cao xuống thấp trước toàn khối để “tạo động lực”. Đối chiếu Thông tư 22/2021/TT-BGDĐT và Chương trình môn học, nhận định nào đúng?", "options": ["(1) và (3) phù hợp; (2) không phù hợp vì đánh giá định kì chỉ được dùng bài viết trên giấy", "Cả ba đề xuất đều phù hợp vì hình thức đánh giá do tổ chuyên môn toàn quyền quyết định", "(1) và (2) phù hợp; (3) không phù hợp vì trái yêu cầu không so sánh học sinh với nhau", "(2) và (3) phù hợp; (1) không phù hợp vì đánh giá thường xuyên chỉ được dùng hỏi – đáp"], "answer": 2, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 4 khoản 4, Điều 6 khoản 1; Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.1.", "explanation": ""}, {"id": 39, "set": 3, "number": 39, "level": "Vận dụng cao", "text": "Ba công dân nam trong độ tuổi gọi nhập ngũ: A là con của liệt sĩ; B đang học đại học hệ chính quy; C có anh ruột là binh sĩ đang phục vụ tại ngũ. Theo Luật Nghĩa vụ quân sự, kết luận nào đúng?", "options": ["A được miễn gọi nhập ngũ; B và C được tạm hoãn gọi nhập ngũ", "A và C được miễn gọi nhập ngũ; B được tạm hoãn gọi nhập ngũ", "A và B được tạm hoãn gọi nhập ngũ; C được miễn gọi nhập ngũ", "Cả ba công dân A, B và C đều được miễn gọi nhập ngũ"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục về tạm hoãn gọi nhập ngũ và miễn gọi nhập ngũ.", "explanation": ""}, {"id": 40, "set": 3, "number": 40, "level": "Vận dụng cao", "text": "Cho ba biểu hiện: (a) thúc đẩy tự do hoá, tư nhân hoá nhằm xoá bỏ vai trò chủ đạo của kinh tế nhà nước; (b) tạo cho thế hệ trẻ lối sống thực dụng, vị kỉ, đua đòi, hưởng lạc; (c) đòi “phi chính trị hoá” Quân đội nhân dân và Công an nhân dân. Các biểu hiện này lần lượt thuộc thủ đoạn “diễn biến hoà bình” trên lĩnh vực nào?", "options": ["(a) kinh tế; (b) dân tộc, tôn giáo; (c) chính trị", "(a) văn hoá; (b) kinh tế; (c) quốc phòng, an ninh", "(a) kinh tế; (b) văn hoá; (c) quốc phòng, an ninh", "(a) chính trị; (b) văn hoá; (c) dân tộc, tôn giáo"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), mục “Âm mưu, thủ đoạn thực hiện chiến lược “diễn biến hoà bình””.", "explanation": ""}, {"id": 41, "set": 4, "number": 1, "level": "Nhận biết", "text": "Theo Điều 8 Luật Giáo dục quốc phòng và an ninh, ai phê duyệt quy hoạch hệ thống và quy định điều kiện thành lập trung tâm giáo dục quốc phòng và an ninh?", "options": ["Bộ trưởng Bộ Giáo dục và Đào tạo", "Chủ tịch Uỷ ban nhân dân cấp tỉnh", "Bộ trưởng Bộ Quốc phòng", "Thủ tướng Chính phủ"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 8 khoản 4.", "explanation": ""}, {"id": 42, "set": 4, "number": 2, "level": "Nhận biết", "text": "Theo lộ trình quy định tại Điều 6 Nghị định 13/2014/NĐ-CP, đến hết năm 2020 phải có trên bao nhiêu phần trăm giáo viên giáo dục quốc phòng và an ninh được đào tạo đạt trình độ chuẩn?", "options": ["Trên 80%", "Trên 50%", "Trên 90%", "Trên 70%"], "answer": 2, "source": "Nghị định 13/2014/NĐ-CP (VBHN số 53/VBHN-BQP ngày 09/9/2025), Điều 6 khoản 3 điểm a.", "explanation": ""}, {"id": 43, "set": 4, "number": 3, "level": "Nhận biết", "text": "Theo Luật Giáo dục (sửa đổi năm 2025), học sinh phổ thông trong cơ sở giáo dục công lập được hưởng chính sách nào về học phí?", "options": ["Được miễn học phí", "Được hỗ trợ tiền đóng học phí", "Được vay vốn để đóng học phí", "Được giảm 50% học phí"], "answer": 0, "source": "Luật số 123/2025/QH15 sửa đổi, bổ sung Luật Giáo dục, Điều 1 khoản 24 (sửa đổi Điều 99 Luật Giáo dục).", "explanation": ""}, {"id": 44, "set": 4, "number": 4, "level": "Nhận biết", "text": "Theo Điều 24 Luật Giáo dục quốc phòng và an ninh, đào tạo chính quy chuyên ngành giáo dục quốc phòng và an ninh cho người có bằng tốt nghiệp trung học phổ thông được thực hiện tập trung trong thời gian bao lâu?", "options": ["02 năm", "18 tháng", "03 năm", "04 năm"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 24 khoản 1 điểm a.", "explanation": ""}, {"id": 45, "set": 4, "number": 5, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 10, hệ thống cấp hàm sĩ quan Công an nhân dân gồm những cấp nào?", "options": ["Cấp Uý, cấp Tá, cấp Soái", "Cấp Tá, cấp Tướng, cấp Soái", "Cấp Sĩ, cấp Uý, cấp Tá", "Cấp Uý, cấp Tá, cấp Tướng"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục về Luật Công an nhân dân.", "explanation": ""}, {"id": 46, "set": 4, "number": 6, "level": "Nhận biết", "text": "Theo sách giáo khoa lớp 10, cơ quan nào ban hành Bộ quy tắc ứng xử trên mạng xã hội?", "options": ["Bộ Văn hoá, Thể thao và Du lịch", "Bộ Giáo dục và Đào tạo", "Bộ Thông tin và Truyền thông", "Bộ Công an"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Trách nhiệm của cơ quan, tổ chức, cá nhân sử dụng không gian mạng”.", "explanation": ""}, {"id": 47, "set": 4, "number": 7, "level": "Nhận biết", "text": "Ngày 23/6/1994, Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam khoá IX đã thông qua Nghị quyết về việc phê chuẩn văn kiện nào?", "options": ["Công ước của Liên hợp quốc về Luật Biển năm 1982", "Bộ Quy tắc ứng xử của các bên ở Biển Đông (COC)", "Hiệp ước hoạch định biên giới quốc gia trên đất liền", "Tuyên bố về ứng xử của các bên ở Biển Đông (DOC)"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục về chủ quyền biển, đảo.", "explanation": ""}, {"id": 48, "set": 4, "number": 8, "level": "Nhận biết", "text": "Ngày 17/2/1979, chính quyền Trung Quốc huy động lực lượng lớn tiến công sang lãnh thổ Việt Nam ở các tỉnh dọc biên giới phía Bắc trên phạm vi nào?", "options": ["Từ Quảng Ninh đến Lào Cai", "Từ Quảng Ninh đến Lai Châu", "Từ Lạng Sơn đến Hà Giang", "Từ Cao Bằng đến Điện Biên"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục về cuộc chiến đấu bảo vệ biên giới phía Bắc.", "explanation": ""}, {"id": 49, "set": 4, "number": 9, "level": "Thông hiểu", "text": "Theo Điều 8 Luật Giáo dục quốc phòng và an ninh, trung tâm giáo dục quốc phòng và an ninh bao gồm những loại nào?", "options": ["Trung tâm thuộc quân khu và trung tâm thuộc cơ sở giáo dục nghề nghiệp", "Trung tâm thuộc Bộ Công an và trung tâm thuộc Uỷ ban nhân dân cấp tỉnh", "Trung tâm thuộc trường trung học phổ thông và trung tâm thuộc Uỷ ban nhân dân cấp xã", "Trung tâm thuộc nhà trường quân đội và trung tâm thuộc cơ sở giáo dục đại học"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 8 khoản 2.", "explanation": ""}, {"id": 50, "set": 4, "number": 10, "level": "Thông hiểu", "text": "Theo Điều 29 Luật Giáo dục quốc phòng và an ninh, kinh phí giáo dục quốc phòng và an ninh được bảo đảm như thế nào?", "options": ["Do Nhà nước bảo đảm, bố trí hằng năm theo pháp luật về ngân sách nhà nước", "Do cha mẹ học sinh đóng góp theo thoả thuận hằng năm với nhà trường", "Do học sinh, sinh viên nộp cùng với học phí của từng học kì, năm học", "Do giáo viên, giảng viên tự bảo đảm từ thu nhập giảng dạy của mình"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 29 khoản 1.", "explanation": ""}, {"id": 51, "set": 4, "number": 11, "level": "Thông hiểu", "text": "Theo Điều 24 Luật Giáo dục quốc phòng và an ninh, giáo viên, giảng viên giáo dục quốc phòng và an ninh được bồi dưỡng, tập huấn định kỳ tại đâu?", "options": ["Cơ sở giáo dục nghề nghiệp và doanh nghiệp quốc phòng, an ninh trên địa bàn", "Trung tâm giáo dục thường xuyên và trung tâm chính trị ở địa phương nơi giáo viên cư trú", "Trường trung học phổ thông nơi giáo viên đang trực tiếp giảng dạy môn học", "Trường của lực lượng vũ trang nhân dân, trung tâm giáo dục quốc phòng và an ninh"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 24 khoản 2.", "explanation": ""}, {"id": 52, "set": 4, "number": 12, "level": "Thông hiểu", "text": "Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông bố trí nội dung, thời lượng chung. Căn cứ điều kiện cụ thể, cơ quan nào chỉ đạo các trường phân chia thời lượng, lựa chọn địa điểm, hình thức dạy học cho phù hợp?", "options": ["Hội đồng giáo dục quốc phòng và an ninh trung ương", "Bộ chỉ huy quân sự cấp tỉnh", "Các sở giáo dục và đào tạo", "Uỷ ban nhân dân cấp xã"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.5.2.", "explanation": ""}, {"id": 53, "set": 4, "number": 13, "level": "Thông hiểu", "text": "Theo Thông tư 22/2021/TT-BGDĐT, kết quả rèn luyện của học sinh trong từng học kì được đánh giá mức Khá khi nào?", "options": ["Đáp ứng tốt yêu cầu cần đạt về phẩm chất và có nhiều biểu hiện nổi bật trong học kì", "Đáp ứng yêu cầu cần đạt về phẩm chất và có biểu hiện nổi bật nhưng chưa đạt được mức Tốt", "Chưa đáp ứng được yêu cầu cần đạt về phẩm chất nhưng có tiến bộ rõ rệt so với đầu học kì", "Đáp ứng yêu cầu cần đạt về phẩm chất được quy định trong Chương trình giáo dục phổ thông"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 8 khoản 2 điểm a.", "explanation": ""}, {"id": 54, "set": 4, "number": 14, "level": "Thông hiểu", "text": "Theo Điều 19 Thông tư 22/2021/TT-BGDĐT, nội dung nào sau đây thuộc trách nhiệm của giáo viên môn học?", "options": ["Quy định hình thức rèn luyện trong kì nghỉ hè đối với học sinh của trường", "Thực hiện đánh giá thường xuyên và tính điểm trung bình môn học của học sinh", "Tặng giấy khen cho học sinh có thành tích trong rèn luyện và học tập", "Đánh giá kết quả rèn luyện cả năm học của học sinh lớp mình giảng dạy"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 19 khoản 1, khoản 2 (so sánh với Điều 8, Điều 13, Điều 15).", "explanation": ""}, {"id": 55, "set": 4, "number": 15, "level": "Thông hiểu", "text": "Theo Nghị quyết số 248/2025/QH15, mục tiêu nào được xác định phải hoàn thành đến năm 2030?", "options": ["Hoàn thành việc miễn học phí cho toàn bộ sinh viên đại học", "Hoàn thành việc chuyển toàn bộ sách giáo khoa sang sách điện tử", "Hoàn thành việc cung cấp miễn phí sách giáo khoa cho học sinh", "Hoàn thành việc đưa môn Giáo dục quốc phòng và an ninh vào tiểu học"], "answer": 2, "source": "Nghị quyết số 248/2025/QH15, Điều 3 khoản 1.", "explanation": ""}, {"id": 56, "set": 4, "number": 16, "level": "Thông hiểu", "text": "Nội dung nào sau đây thuộc truyền thống của Quân đội nhân dân Việt Nam?", "options": ["Vì nhân dân phục vụ, dựa vào dân để làm việc và chiến đấu thắng lợi; cần, kiệm, liêm, chính, chí công, vô tư", "Cách đánh du kích trở thành di sản vô giá trong kho tàng nghệ thuật quân sự; không thoát li sản xuất", "Bảo vệ an ninh Tổ quốc là nhiệm vụ trung tâm; đấu tranh phòng, chống tội phạm là nhiệm vụ thường xuyên", "Trung thành vô hạn với Tổ quốc, với Đảng, Nhà nước và nhân dân; quyết chiến, quyết thắng, biết đánh, biết thắng"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, mục “Truyền thống của Quân đội nhân dân Việt Nam”.", "explanation": ""}, {"id": 57, "set": 4, "number": 17, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 10, công dân Việt Nam cần đáp ứng yêu cầu nào để có thể được tuyển chọn đào tạo sĩ quan Quân đội và Công an nhân dân?", "options": ["Đủ tiêu chuẩn về chính trị, phẩm chất đạo đức, trình độ học vấn, sức khoẻ, tuổi đời; có nguyện vọng và khả năng", "Có nguyện vọng hoạt động trong lĩnh vực quân sự và có người thân đang công tác trong lực lượng vũ trang", "Đủ tiêu chuẩn về sức khoẻ và tuổi đời; đã hoàn thành nghĩa vụ quân sự tại ngũ ít nhất 24 tháng trong thời bình", "Có bằng tốt nghiệp đại học trở lên và đã được phong quân hàm sĩ quan dự bị theo quy định của pháp luật"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, mục “Tiêu chuẩn”.", "explanation": ""}, {"id": 58, "set": 4, "number": 18, "level": "Thông hiểu", "text": "Theo Luật An toàn thông tin mạng năm 2015 (nêu trong sách giáo khoa lớp 10), “mạng” được hiểu là gì?", "options": ["Sự bảo đảm hoạt động trên không gian mạng không gây phương hại đến an ninh quốc gia, trật tự, an toàn xã hội, quyền và lợi ích hợp pháp", "Môi trường trong đó thông tin được cung cấp, truyền đưa, thu thập, xử lý, lưu trữ và trao đổi thông qua mạng viễn thông và mạng máy tính", "Hệ thống các thiết bị đầu cuối, đường truyền và máy chủ do một doanh nghiệp viễn thông được cấp phép trực tiếp quản lí, khai thác", "Tập hợp các trang thông tin điện tử, mạng xã hội và ứng dụng do cơ quan nhà nước có thẩm quyền thiết lập, vận hành và kiểm duyệt"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Một số khái niệm cơ bản về mạng và an ninh mạng”.", "explanation": ""}, {"id": 59, "set": 4, "number": 19, "level": "Thông hiểu", "text": "Nội dung nào sau đây là quan điểm của Chiến lược bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới?", "options": ["Giữ vững sự lãnh đạo trực tiếp, tuyệt đối về mọi mặt của Đảng đối với sự nghiệp bảo vệ Tổ quốc", "Dựa chủ yếu vào sự giúp đỡ của các nước lớn và các tổ chức quốc tế để bảo vệ Tổ quốc", "Đặt nhiệm vụ bảo vệ Tổ quốc tách rời và đứng trên nhiệm vụ xây dựng, phát triển đất nước", "Coi sức mạnh quân sự là nhân tố duy nhất quyết định thắng lợi của sự nghiệp bảo vệ Tổ quốc"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Quan điểm”.", "explanation": ""}, {"id": 60, "set": 4, "number": 20, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 11, cách thức hoạt động phổ biến của các loại tội phạm hiện nay là gì?", "options": ["Hoạt động đơn lẻ, cố định tại một địa bàn quen thuộc; không sử dụng công cụ, phương tiện hỗ trợ", "Chỉ hoạt động trên không gian mạng, không gắn với địa bàn cụ thể và không có sự cấu kết với nhau", "Cấu kết thành băng nhóm; sử dụng vũ khí, công cụ, phương tiện; hoạt động lưu động, xuyên quốc gia", "Chỉ hoạt động vào ban đêm tại các khu vực vắng người ở nông thôn, miền núi và vùng biên giới"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), mục “Cách thức hoạt động phổ biến của các loại tội phạm”.", "explanation": ""}, {"id": 61, "set": 4, "number": 21, "level": "Thông hiểu", "text": "Theo pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ, nhóm nào sau đây thuộc vũ khí quân dụng?", "options": ["Súng cầm tay; vũ khí hạng nặng; bom, mìn, lựu đạn, ngư lôi, thuỷ lôi", "Kiếm, giáo, mác, thương, dao găm, lưỡi lê, đao, mã tấu, côn, cung, nỏ", "Kíp nổ, dây nổ, dây cháy chậm, mồi nổ, thiết bị chuyên dùng", "Dùi cui điện, bình xịt hơi cay, súng bắn đạn cao su, còng số 8"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), mục “Một số khái niệm”.", "explanation": ""}, {"id": 62, "set": 4, "number": 22, "level": "Thông hiểu", "text": "Theo Luật Nghĩa vụ quân sự, đối tượng nào sau đây được miễn đăng kí nghĩa vụ quân sự?", "options": ["Người khuyết tật, người mắc bệnh hiểm nghèo, bệnh tâm thần hoặc bệnh mạn tính", "Người đang học tại cơ sở giáo dục phổ thông hoặc đang học đại học hệ chính quy", "Người đang chấp hành hình phạt tù, cải tạo không giam giữ hoặc đang bị quản chế", "Con của liệt sĩ, con của thương binh hạng một; một anh hoặc một em trai của liệt sĩ"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục về đăng kí nghĩa vụ quân sự (phân biệt với đối tượng không được đăng kí, miễn gọi nhập ngũ, tạm hoãn gọi nhập ngũ).", "explanation": ""}, {"id": 63, "set": 4, "number": 23, "level": "Thông hiểu", "text": "Nghệ thuật quân sự Việt Nam trong cuộc chiến tranh bảo vệ biên giới Tây Nam của Tổ quốc có điểm nổi bật nào?", "options": ["Chỉ sử dụng lực lượng dân quân tự vệ tại chỗ để phòng ngự lâu dài trên toàn tuyến biên giới Tây Nam", "Tập trung toàn bộ lực lượng hải quân mở các trận đánh quyết định trên vùng biển Tây Nam của Tổ quốc", "Chủ yếu dựa vào đấu tranh ngoại giao trên các diễn đàn quốc tế, hạn chế tối đa hoạt động tác chiến", "Kết hợp chặt chẽ lực lượng tại chỗ với các binh đoàn chủ lực; liên minh chiến đấu với cách mạng Campuchia"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), mục về nghệ thuật quân sự trong chiến tranh bảo vệ biên giới Tây Nam.", "explanation": ""}, {"id": 64, "set": 4, "number": 24, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, lực lượng dự bị động viên được hiểu như thế nào?", "options": ["Là lực lượng nòng cốt, chuyên trách quản lí, bảo vệ biên giới quốc gia và khu vực biên giới của Tổ quốc", "Là lực lượng được tổ chức ở cấp tỉnh, cấp xã, do cơ quan quân sự địa phương trực tiếp chỉ huy trong tác chiến", "Gồm quân nhân dự bị và phương tiện kĩ thuật dự bị, sẵn sàng bổ sung cho lực lượng thường trực của Quân đội nhân dân", "Là lực lượng vũ trang quần chúng không thoát li sản xuất, công tác, được tổ chức ở địa phương và ở cơ quan, tổ chức"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Thành phần của lực lượng vũ trang địa phương”.", "explanation": ""}, {"id": 65, "set": 4, "number": 25, "level": "Vận dụng", "text": "Khi dạy bài “Đội ngũ từng người không có súng”, thầy giáo dự kiến lấy điểm đánh giá thường xuyên bằng phần thực hành động tác của từng học sinh và sản phẩm video tập luyện của nhóm. Theo Thông tư 22/2021/TT-BGDĐT, dự kiến này có phù hợp không?", "options": ["Chỉ phù hợp nếu được Sở Giáo dục và Đào tạo phê duyệt trước hình thức đánh giá của từng bài học", "Phù hợp, vì thực hành và sản phẩm học tập đều là hình thức đánh giá thường xuyên được quy định", "Không phù hợp, vì sản phẩm học tập của nhóm chỉ được dùng để nhận xét, không được dùng để cho điểm", "Không phù hợp, vì đánh giá thường xuyên chỉ được thực hiện bằng bài kiểm tra viết trên giấy hoặc trên máy tính"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 6 khoản 1.", "explanation": ""}, {"id": 66, "set": 4, "number": 26, "level": "Vận dụng", "text": "Doanh nghiệp X bảo đảm kinh phí tổ chức phổ biến kiến thức quốc phòng và an ninh cho người lao động của mình theo quy định. Theo Điều 29 Luật Giáo dục quốc phòng và an ninh, khoản kinh phí này được xử lí như thế nào?", "options": ["Được ngân sách nhà nước hoàn trả toàn bộ vào cuối năm tài chính", "Phải thu lại từ người lao động đã tham gia các lớp phổ biến kiến thức", "Phải trích từ quỹ khen thưởng, phúc lợi của người lao động", "Được tính vào các khoản chi được trừ khi xác định thu nhập chịu thuế"], "answer": 3, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 29 khoản 2.", "explanation": ""}, {"id": 67, "set": 4, "number": 27, "level": "Vận dụng", "text": "Năm học 2026 – 2027, bạn A học lớp 11 tại một trường trung học phổ thông công lập, bạn B học lớp 11 tại một trường trung học phổ thông tư thục. Theo Luật Giáo dục (sửa đổi năm 2025), chính sách học phí đối với hai bạn như thế nào?", "options": ["A được giảm một nửa học phí; B được hỗ trợ tiền đóng học phí theo mức do Hiệu trưởng nhà trường quyết định", "A được miễn học phí; B được Nhà nước hỗ trợ tiền đóng học phí, mức hỗ trợ do Hội đồng nhân dân cấp tỉnh quyết định", "A được miễn học phí; B phải đóng toàn bộ học phí theo mức thu của trường và không được Nhà nước hỗ trợ", "A và B đều được miễn toàn bộ học phí, không phân biệt cơ sở giáo dục công lập hay cơ sở giáo dục tư thục"], "answer": 1, "source": "Luật số 123/2025/QH15 sửa đổi, bổ sung Luật Giáo dục, Điều 1 khoản 24 (sửa đổi Điều 99 khoản 3 Luật Giáo dục).", "explanation": ""}, {"id": 68, "set": 4, "number": 28, "level": "Vận dụng", "text": "Cô N nói với học sinh rằng em nào muốn đạt điểm cao môn của cô thì phải đăng kí lớp học thêm do cô tổ chức. Theo Luật Nhà giáo năm 2025, việc làm của cô N thuộc trường hợp nào?", "options": ["Việc nhà giáo không được làm: ép buộc người học tham gia học thêm dưới mọi hình thức", "Việc được khuyến khích: tổ chức dạy thêm để nâng cao chất lượng của môn học", "Việc chỉ bị cấm khi mức thu tiền học thêm vượt quá mức do nhà trường quy định", "Quyền của nhà giáo: được chủ động lựa chọn hình thức phụ đạo cho người học của mình"], "answer": 0, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 11 khoản 2 điểm c.", "explanation": ""}, {"id": 69, "set": 4, "number": 29, "level": "Vận dụng", "text": "Học sinh P bị ốm phải điều trị dài ngày nên nghỉ học tổng cộng 48 buổi trong năm học (đều có phép). Kết quả rèn luyện và kết quả học tập cả năm của P đều được đánh giá mức Đạt. Theo Thông tư 22/2021/TT-BGDĐT, P có được lên lớp không?", "options": ["Không, vì học sinh nghỉ học quá 30 buổi trong một năm học thì không được lên lớp", "Không, vì P nghỉ quá 45 buổi; số buổi nghỉ tính cả nghỉ có phép và không phép", "Có, vì nghỉ học có phép thì không tính vào tổng số buổi nghỉ học trong năm học", "Có, vì kết quả rèn luyện và kết quả học tập cả năm của P đều đạt mức Đạt trở lên"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 12 khoản 1 điểm c, khoản 3.", "explanation": ""}, {"id": 70, "set": 4, "number": 30, "level": "Vận dụng", "text": "Bạn M phát hiện một tài khoản mạng xã hội liên tục đăng tải nội dung có dấu hiệu xâm phạm an ninh mạng. Theo trách nhiệm của cá nhân sử dụng không gian mạng nêu trong sách giáo khoa lớp 10, M nên làm gì?", "options": ["Chia sẻ rộng rãi các nội dung đó lên trang cá nhân để cảnh báo cho bạn bè biết", "Bỏ qua, vì bảo vệ an ninh mạng là việc riêng của lực lượng chuyên trách", "Kịp thời cung cấp thông tin cho cơ quan có thẩm quyền, lực lượng bảo vệ an ninh mạng", "Tự tìm cách xâm nhập, chiếm quyền điều khiển tài khoản đó để gỡ bỏ nội dung"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, mục “Trách nhiệm của cơ quan, tổ chức, cá nhân sử dụng không gian mạng”.", "explanation": ""}, {"id": 71, "set": 4, "number": 31, "level": "Vận dụng", "text": "Trên chuyến đò ngang qua sông, người lái đò yêu cầu hành khách mặc áo phao và ngồi yên tại chỗ. Một số bạn học sinh cho rằng sông hẹp nên không cần thực hiện. Theo sách giáo khoa lớp 10, cách ứng xử nào đúng?", "options": ["Chỉ cần thực hiện khi đò chở quá số người quy định hoặc khi trời mưa to, gió lớn", "Tuyệt đối tuân theo sự hướng dẫn của thuyền viên, người lái phương tiện", "Tự quyết định theo khả năng bơi của mình, vì người lái đò không có quyền yêu cầu", "Chỉ học sinh nhỏ tuổi mới phải thực hiện, học sinh trung học phổ thông thì không cần"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, mục “Đối với hoạt động giao thông đường thuỷ nội địa”.", "explanation": ""}, {"id": 72, "set": 4, "number": 32, "level": "Vận dụng", "text": "Một hộ dân ở xã biên giới dự định đắp đập ngăn dòng suối biên giới để lấy nước tưới cho nương rẫy. Theo Luật Biên giới quốc gia, nhận định nào đúng?", "options": ["Chỉ bị cấm trong mùa khô; vào mùa mưa thì người dân được tự do ngăn dòng suối biên giới", "Được làm, vì việc sử dụng nguồn nước để sản xuất là quyền của người dân sinh sống ở khu vực biên giới", "Không được làm, vì làm thay đổi dòng chảy tự nhiên của sông, suối biên giới là hành vi bị nghiêm cấm", "Được làm nếu phần đập chỉ nằm trên phần lãnh thổ Việt Nam và không xê dịch mốc quốc giới"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục “Các hành vi bị nghiêm cấm”.", "explanation": ""}, {"id": 73, "set": 4, "number": 33, "level": "Vận dụng", "text": "Em trai của bạn H bị sốt cao kéo dài. Một người quen khuyên gia đình mời thầy cúng về “trừ tà” thay vì đưa em đi bệnh viện. Vận dụng kiến thức về phòng chống tệ nạn xã hội, H nên làm gì?", "options": ["Để gia đình cúng trước, nếu em không khỏi bệnh thì mới tính đến việc đi bệnh viện", "Đồng ý làm theo, vì cúng “trừ tà” là phong tục tín ngưỡng được pháp luật bảo hộ", "Không can thiệp, vì đây là việc riêng của người lớn và không liên quan gì đến pháp luật", "Giải thích đó là mê tín dị đoan, vận động gia đình đưa em đến cơ sở y tế để khám, chữa bệnh"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), mục “Một số loại tệ nạn xã hội”, “Trách nhiệm của học sinh”.", "explanation": ""}, {"id": 74, "set": 4, "number": 34, "level": "Vận dụng", "text": "Anh K nhận được quyết định gọi khám sức khoẻ nghĩa vụ quân sự nhưng không có mặt đúng thời gian, địa điểm ghi trong quyết định mà không có lí do chính đáng. Theo Nghị định số 218/2025/NĐ-CP nêu trong sách giáo khoa lớp 11, anh K bị xử phạt ở mức nào?", "options": ["Phạt tiền từ 30 000 000 đồng đến 40 000 000 đồng", "Phạt tiền từ 15 000 000 đồng đến 20 000 000 đồng", "Phạt tiền từ 3 000 000 đồng đến 5 000 000 đồng", "Phạt tiền từ 5 000 000 đồng đến 8 000 000 đồng"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Xử lí vi phạm hành chính”.", "explanation": ""}, {"id": 75, "set": 4, "number": 35, "level": "Vận dụng", "text": "Anh V là dân quân thường trực và đã có 24 tháng phục vụ. Theo Luật Nghĩa vụ quân sự, trong thời bình anh V có được công nhận hoàn thành nghĩa vụ quân sự tại ngũ không?", "options": ["Có, vì dân quân thường trực có ít nhất 24 tháng phục vụ thuộc trường hợp được công nhận", "Không, vì Dân quân tự vệ không phải là lực lượng thuộc Quân đội nhân dân Việt Nam", "Không, anh V chỉ thuộc diện được tạm hoãn gọi nhập ngũ trong thời gian đang phục vụ", "Chưa, vì dân quân thường trực phải phục vụ liên tục từ đủ 36 tháng trở lên mới được công nhận"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), mục “Nghĩa vụ quân sự của công dân”.", "explanation": ""}, {"id": 76, "set": 4, "number": 36, "level": "Vận dụng", "text": "Trong giờ thảo luận, một bạn phát biểu: “Dân quân tự vệ là một bộ phận của Quân đội nhân dân Việt Nam”. Dựa vào kiến thức sách giáo khoa lớp 10, em nhận xét phát biểu này như thế nào?", "options": ["Đúng, vì Dân quân tự vệ có chung ngày truyền thống 22/12 với Quân đội nhân dân Việt Nam", "Chưa đúng, vì Dân quân tự vệ là một bộ phận của lực lượng Công an nhân dân ở cơ sở", "Đúng, vì Dân quân tự vệ do cơ quan quân sự địa phương chỉ huy nên thuộc Quân đội nhân dân", "Chưa đúng, vì Dân quân tự vệ là một thành phần riêng của lực lượng vũ trang nhân dân"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, phần ghi nhớ về lực lượng vũ trang nhân dân Việt Nam.", "explanation": ""}, {"id": 77, "set": 4, "number": 37, "level": "Vận dụng cao", "text": "Cho ba nhận định về Luật Giáo dục quốc phòng và an ninh: (1) báo cáo viên giáo dục quốc phòng và an ninh chỉ gồm sĩ quan Quân đội và Công an; (2) công dân có quyền và trách nhiệm học tập, nghiên cứu để nắm vững kiến thức quốc phòng và an ninh; (3) cản trở việc thực hiện giáo dục quốc phòng và an ninh là hành vi bị nghiêm cấm. Kết luận nào đúng?", "options": ["Nhận định (2) và (3) đúng; nhận định (1) sai", "Nhận định (1) và (3) đúng; nhận định (2) sai", "Cả ba nhận định (1), (2) và (3) đều đúng", "Nhận định (1) và (2) đúng; nhận định (3) sai"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 7, Điều 9 khoản 2, Điều 26 (báo cáo viên còn gồm lãnh đạo bộ, ban, ngành, lãnh đạo cấp tỉnh, cấp xã, chuyên gia, nhà khoa học).", "explanation": ""}, {"id": 78, "set": 4, "number": 38, "level": "Vận dụng cao", "text": "Cuối năm học, học sinh Y có 01 môn đánh giá bằng nhận xét ở mức Chưa đạt; trong 9 môn đánh giá bằng điểm số có 7 môn có điểm trung bình môn cả năm từ 6,5 trở lên, hai môn còn lại đạt 5,2 và 3,4. Theo Thông tư 22/2021/TT-BGDĐT, kết quả học tập cả năm của Y được đánh giá mức nào?", "options": ["Mức Khá, vì có ít nhất 6 môn có điểm trung bình môn cả năm từ 6,5 điểm", "Mức Chưa đạt, vì có môn học có điểm trung bình môn cả năm dưới 3,5 điểm", "Mức Đạt, vì chỉ có một môn nhận xét Chưa đạt và có trên 6 môn từ 5,0 điểm", "Mức Đạt, vì điểm trung bình chung của các môn học vẫn đạt trên 5,0 điểm"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 9 khoản 2 điểm c, điểm d.", "explanation": ""}, {"id": 79, "set": 4, "number": 39, "level": "Vận dụng cao", "text": "Cho ba nhận định về các vùng biển Việt Nam: (1) nội thuỷ là vùng nước ở phía trong đường cơ sở và là bộ phận lãnh thổ của Việt Nam; (2) vùng đặc quyền kinh tế có chiều rộng 200 hải lí tính từ ranh giới ngoài của lãnh hải; (3) ranh giới ngoài thềm lục địa cách đường cơ sở không quá 350 hải lí. Kết luận nào đúng?", "options": ["Nhận định (2) và (3) đúng; nhận định (1) sai", "Nhận định (1) và (2) đúng; nhận định (3) sai", "Nhận định (1) và (3) đúng; nhận định (2) sai", "Cả ba nhận định (1), (2) và (3) đều đúng"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), mục về các vùng biển Việt Nam (vùng đặc quyền kinh tế hợp với lãnh hải thành vùng biển rộng 200 hải lí tính từ đường cơ sở).", "explanation": ""}, {"id": 80, "set": 4, "number": 40, "level": "Vận dụng cao", "text": "Cho ba nhận định về lực lượng vũ trang địa phương: (1) bộ đội địa phương là một thành phần của Quân đội nhân dân Việt Nam, được tổ chức ở cấp tỉnh, cấp xã; (2) Dân quân tự vệ được tổ chức ở địa phương gọi là dân quân, ở cơ quan, tổ chức gọi là tự vệ; (3) bộ đội biên phòng là một thành phần của Công an nhân dân, chuyên trách bảo vệ biên giới. Kết luận nào đúng?", "options": ["Nhận định (1) và (3) đúng; nhận định (2) sai", "Cả ba nhận định (1), (2) và (3) đều đúng", "Nhận định (1) và (2) đúng; nhận định (3) sai", "Nhận định (2) và (3) đúng; nhận định (1) sai"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), mục “Thành phần của lực lượng vũ trang địa phương” (bộ đội biên phòng là thành phần của Quân đội nhân dân Việt Nam).", "explanation": ""}];</script><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gdqp-de34-thpt-80-20261124-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{wrong:[],bookmarks:[],history:[]}}catch{db={wrong:[],bookmarks:[],history:[]}}let active=null,timer=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const bank=QUESTIONS.filter(q=>!q.placeholder);const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function dashboard(){clearInterval(timer);active=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">GDQP&AN · Tài liệu ôn luyện được cung cấp</div><h1>Ôn luyện GDQP&AN · Đề 3–4</h1><p>80 câu hỏi · Đề số 3 và đề số 4, mỗi đề 40 câu. Luyện từng câu, tra cứu tài liệu và xem lại kết quả.</p><button class="lime" data-start="practice">Luyện tổng hợp 80 câu →</button></div><div class="emblem">★<small>ÔN TẬP KIẾN THỨC</small></div></section><section class="stats"><div class="stat"><strong>80</strong><span class="muted">Câu hỏi đầy đủ</span></div><div class="stat"><strong>${db.history.length}</strong><span class="muted">Lượt đã hoàn thành</span></div><div class="stat"><strong>${db.wrong.length}</strong><span class="muted">Câu cần ôn lại</span></div><div class="stat"><strong>${db.bookmarks.length}</strong><span class="muted">Câu đã đánh dấu</span></div></section><div class="notice">Nội dung, đáp án và nguồn dẫn được nhập từ file anh cung cấp, chưa thẩm định lại. Nguồn đối chiếu được hiển thị khi kiểm tra đáp án. Đáp án đã được đối chiếu giữa nội dung từng câu và bảng đáp án cuối mỗi đề; chưa thẩm định lại kiến thức và hiệu lực văn bản. Vị trí phương án được đảo khi luyện. Thời gian thi thử do anh chọn, không phải thời gian quy định trong tài liệu.</div><div class="panel"><h3>Thiết lập thời gian mỗi đề</h3><select id="duration" aria-label="Thời gian thi thử"><option value="40" selected>40 phút</option><option value="50">50 phút</option><option value="60">60 phút</option></select></div><h2 style="margin-top:25px">Chọn bộ đề</h2><section class="grid">${[3,4].map(n=>`<article class="card"><span class="tag">ĐỀ ${n} · 40 CÂU</span><h3>Đề ${n}</h3><button data-topic="${n}">Luyện từng câu →</button><button class="primary" data-exam="${n}">Thi thử đề ${n} →</button></article>`).join('')}<article class="card"><h3>Củng cố kiến thức</h3><button data-start="wrong">Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">Câu đánh dấu (${db.bookmarks.length})</button></article></section><h2 style="margin-top:30px">Tra cứu câu hỏi</h2><div class="tools"><input id="search" placeholder="Tìm nội dung câu hỏi…" aria-label="Tìm câu hỏi"><select id="level" aria-label="Mức độ"><option value="">Tất cả mức độ</option>${[...new Set(bank.map(q=>q.level))].map(l=>`<option>${esc(l)}</option>`).join('')}</select><button id="browse">Tra cứu</button></div><div id="searchResults"></div><h2 style="margin-top:30px">Lịch sử luyện tập</h2>${db.history.slice(0,10).map(h=>`<div class="history row"><span>${esc(h.mode)} · ${esc(h.date)}</span><b>${h.correct}/${h.total} câu đúng · ${h.score}/10</b></div>`).join('')||'<p class="muted">Chưa có lượt hoàn thành.</p>'}<p class="muted">Tiến độ được lưu trên trình duyệt và thiết bị đang sử dụng.</p>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('practice',+b.dataset.topic));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start('exam',+b.dataset.exam));$('#browse').onclick=browse;$('#search').oninput=browse;$('#level').onchange=browse}
function browse(){let s=$('#search').value.toLocaleLowerCase('vi'),l=$('#level').value;let list=bank.filter(q=>(!l||q.level===l)&&(q.text+' '+q.options.join(' ')).toLocaleLowerCase('vi').includes(s));$('#searchResults').innerHTML=`<p class="muted">${list.length} câu phù hợp</p>`+list.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${esc(q.level)}</span><p>${esc(q.text)}</p><details><summary>Xem phương án và đáp án từ tài liệu</summary>${q.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓':''}</p>`).join('')}</details></div>`).join('')}
function start(mode,topic){let minutes=Number($('#duration')?.value||50);let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(topic)qs=qs.filter(q=>q.set===topic);qs=qs.map(q=>{let opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),answer:opts.findIndex(o=>o.index===q.answer)}});if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+minutes*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?`THI THỬ · BỘ ĐỀ ${a.qs[0].set}`:'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${show?`<div class="answer-note">${q.explanation?`<p>${esc(q.explanation)}</p>`:''}<b>${ans===q.answer?'✓ Trùng đáp án tài liệu':'Đáp án tài liệu: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn dẫn trong file: ${esc(q.source)} · Câu gốc ${q.number}. Chưa thẩm định nguồn.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button>${a.mode!=='exam'&&!show?`<button class="primary" id="check" ${ans===undefined?'disabled':''}>Kiểm tra đáp án</button>`:''}<button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn phương án rồi nhấn Kiểm tra đáp án.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){if(a.answers[q.id]===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:(a.mode==='exam'?'Thi thử':'Luyện tập')+(a.qs.every(q=>q.set===a.qs[0].set)?' đề '+(a.qs[0].set):' tổng hợp'),date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p><p class="muted">Nguồn dẫn trong file: ${esc(q.source)}</p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
